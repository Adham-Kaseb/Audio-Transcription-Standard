<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      دليل تفريغ وترقيم التسجيلات الصوتية | MSA Audio Transcription Guidelines
    </title>
    <meta
      name="description"
      content="الدليل المعياري الشامل وقواعد الترقيم والتوصيف لتفريغ التسجيلات الصوتية باللغة العربية الفصحى الحديثة (MSA Verbatim Transcription Guidelines)"
    />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />

    <!-- Open Graph (OG) Meta Tags for Social Sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="دليل تفريغ وترقيم التسجيلات الصوتية | MSA Audio Transcription Guidelines"
    />
    <meta
      property="og:description"
      content="الدليل المعياري الشامل وقواعد الترقيم والتوصيف لتفريغ التسجيلات الصوتية باللغة العربية الفصحى الحديثة مع حاسبة معدل الإنجاز وفاحص القواعد الفوري"
    />
    <meta property="og:image" content="og_banner_image_1785694923684.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="دليل تفريغ وترقيم التسجيلات الصوتية | MSA Audio Transcription Guidelines"
    />
    <meta
      name="twitter:description"
      content="الدليل المعياري الشامل وقواعد الترقيم والتوصيف لتفريغ التسجيلات الصوتية باللغة العربية الفصحى الحديثة"
    />
    <meta name="twitter:image" content="og_banner_image_1785694923684.png" />

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Lenis Smooth Scroll CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/lenis@1.1.18/dist/lenis.css"
    />

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Ambient Glow Orbs -->
    <div class="orb-glow orb-1"></div>
    <div class="orb-glow orb-2"></div>
    <div class="orb-glow orb-3"></div>

    <!-- FLOATING LIGHT GLASSMORTIC NAVBAR -->
    <nav class="navbar">
      <div class="nav-container">
        <a href="#" class="brand">
          <div class="brand-icon">
            <i class="fas fa-microphone-alt"></i>
          </div>
          <div>
            <div style="line-height: 1.25; font-size: 1.2rem">
              مركز تفريغ الصوتيات
            </div>
          </div>
        </a>

        <!-- Navigation Links Dropdown Menu -->
        <div class="nav-dropdown-wrapper" id="nav-dropdown-wrapper">
          <button
            class="nav-dropdown-btn"
            id="nav-dropdown-btn"
            onclick="toggleNavDropdown(event)"
          >
            <i class="fas fa-bars"></i>
            <span>أقسام المنصة</span>
            <i class="fas fa-chevron-down nav-dropdown-arrow"></i>
          </button>
          <div class="nav-dropdown-menu">
            <a
              href="#qa-search-section"
              class="dropdown-item"
              onclick="closeNavDropdown()"
            >
              <i class="fas fa-search" style="color: #6366f1"></i>
              <span>الإجابات الفورية</span>
            </a>
            <a
              href="#text-checker-section"
              class="dropdown-item"
              onclick="closeNavDropdown()"
            >
              <i class="fas fa-spell-check" style="color: #3b82f6"></i>
              <span>فاحص النصوص والقواعد</span>
            </a>
            <a
              href="#faq-section"
              class="dropdown-item"
              onclick="closeNavDropdown()"
            >
              <i class="fas fa-question-circle" style="color: #8b5cf6"></i>
              <span>مكتبة الأسئلة الشائعة</span>
            </a>
            <a
              href="#calculator-section"
              class="dropdown-item"
              onclick="closeNavDropdown()"
            >
              <i class="fas fa-calculator" style="color: #22c55e"></i>
              <span>معدل الإنجاز </span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- FLOATING SIDE NAVIGATOR ON SCROLL -->
    <aside class="side-nav" id="side-nav">
      <div class="side-nav-inner">
        <a
          href="#qa-search-section"
          class="side-nav-item active"
          data-tooltip="البحث والإجابة الفورية"
        >
          <i class="fas fa-search"></i>
        </a>
        <a
          href="#text-checker-section"
          class="side-nav-item"
          data-tooltip="فاحص القواعد الفوري"
        >
          <i class="fas fa-spell-check"></i>
        </a>
        <a
          href="#faq-section"
          class="side-nav-item"
          data-tooltip="الأسئلة الشائعة"
        >
          <i class="fas fa-question-circle"></i>
        </a>
        <a
          href="#calculator-section"
          class="side-nav-item"
          data-tooltip=" معدل الإنجاز"
        >
          <i class="fas fa-calculator"></i>
        </a>
        <button
          class="side-nav-item side-nav-top-btn"
          onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
          data-tooltip="الرجوع للأعلى"
        >
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="app-container" id="main-content-container">
      <!-- Dynamic Content Rendered via app.js -->
    </main>

    <footer class="footer">
      <div class="footer-content">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: var(--text-primary);
            font-size: 1.1rem;
          "
        >
          <i class="fas fa-shield-check" style="color: #6366f1"></i>
          Modern Standard Arabic (MSA) Audio Transcription & Annotation Hub
        </div>
        <!-- Developer Credentials Showcase Card -->
        <a
          href="https://wa.me/201120610381"
          target="_blank"
          rel="noopener noreferrer"
          class="developer-showcase-card"
        >
          <div class="dev-card-header">
            <div class="dev-avatar">
              <i class="fas fa-code"></i>
            </div>
            <div class="dev-info">
              <div class="dev-name">
                أدهم كاسب
                <i class="fas fa-check-circle dev-verified-icon"></i>
              </div>
              <div class="dev-role">إعداد وتهيئة</div>
            </div>
          </div>

          <p class="dev-bio">
            تم إعداد المنصة بتوافق 100% مع الدليل المعياري الرسمي، ومساحة تدريب
            تفاعلية .
          </p>

          <div class="dev-cta-btn">
            <i class="fab fa-whatsapp whatsapp-icon"></i>
            <span>تواصل مباشر عبر واتساب</span>
            <i class="fas fa-arrow-left dev-arrow-icon"></i>
          </div>
        </a>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
